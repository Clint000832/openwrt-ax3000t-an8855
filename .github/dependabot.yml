version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "ci(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release*"
          - "@semantic-release/*"
          - "conventional-changelog*"
        update-types:
          - "minor"
          - "patch"